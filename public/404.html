<!doctype html>
<!--
  GitHub Pages no soporta rewrites de servidor para SPAs: cualquier ruta
  que no sea un archivo real (ej. /ventas) devuelve este 404.html en vez
  de index.html. Esta página traduce la URL a un query param y redirige
  a la raíz; el script en index.html la reconstruye antes de que
  React Router monte. Técnica estándar: https://github.com/rafgraph/spa-github-pages
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>AromaPro</title>
    <script>
      var basePath = "/__BASE_PATH__/"; // reemplazado en build por el workflow de CI
      var path = location.pathname.slice(basePath.length);
      var redirectQuery =
        "?redirect=" + encodeURIComponent(path + location.search + location.hash);
      location.replace(basePath + redirectQuery);
    </script>
  </head>
  <body></body>
</html>
