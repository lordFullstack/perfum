      rel="stylesheet"
    />

    <title>AromaPro</title>

    <!--
      Complemento del truco de public/404.html: si llegamos acá con un
      ?redirect=..., reescribimos la URL a la ruta real ANTES de que
      React Router monte, para que no se note el salto por el 404.
      No tiene efecto en Vercel/Netlify (ahí nunca se genera ese query param).
    -->
    <script>
      (function () {
        var params = new URLSearchParams(location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          var base = location.pathname; // ya incluye el base path servido
          history.replaceState(null, "", base + redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
